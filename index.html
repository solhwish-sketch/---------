<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="전주와 도쿄의 일상을 나누는 하루핀">
  <title>Haru Pin ハルピン</title>
  <!-- 지도와 앱 화면 스타일, 기능을 불러옵니다. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="welcome-mode">
  <!-- 앱을 처음 열었을 때 보이는 언어 선택과 로그인 화면입니다. -->
  <main class="welcome-screen" id="welcome-screen">
    <section class="welcome-card" aria-labelledby="brand-title">
      <div class="brand-mark" aria-hidden="true"><span>H</span><i>●</i></div>
      <p class="brand-caption">하루의 장소와 이야기를 잇다</p>
      <h1 id="brand-title">Haru Pin <span>ハルピン</span></h1>

      <section class="language-section" aria-labelledby="language-heading">
        <h2 id="language-heading">언어 설정</h2>
        <div class="language-options" role="group" aria-label="언어 선택">
          <button class="language-card is-selected" type="button" data-language="ko" aria-pressed="true">
            <span class="language-flag" aria-hidden="true">🇰🇷</span>
            <span class="language-name">한국어</span>
            <span class="language-check" aria-hidden="true">✓</span>
          </button>
          <button class="language-card" type="button" data-language="ja" aria-pressed="false">
            <span class="language-flag" aria-hidden="true">🇯🇵</span>
            <span class="language-name">日本語 <small>(にほんご)</small></span>
            <span class="language-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </section>

      <!-- 데모용 닉네임과 비밀번호 입력 폼입니다. -->
      <form id="auth-form" class="auth-form">
        <h2 id="auth-heading">로그인</h2>
        <label for="auth-nickname">닉네임</label>
        <input id="auth-nickname" name="nickname" type="text" autocomplete="username" required>
        <p id="signup-id-hint" class="signup-hint" aria-live="polite" hidden></p>
        <label for="auth-password">비밀번호</label>
        <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
        <p id="signup-password-hint" class="signup-hint" aria-live="polite" hidden></p>
        <div id="signup-password-confirm-wrap" hidden>
          <label for="auth-password-confirm" id="auth-password-confirm-label">비밀번호 확인</label>
          <input id="auth-password-confirm" name="password-confirm" type="password" autocomplete="new-password" disabled>
          <p id="signup-password-confirm-hint" class="signup-hint" aria-live="polite" hidden></p>
        </div>
        <button class="primary-auth-button" type="submit" id="login-button">로그인</button>
        <button class="signup-button" type="button" id="signup-button">처음이에요 / 회원가입</button>
        <fieldset id="signup-consents" hidden><legend id="signup-consents-legend">가입 동의</legend>
          <label><input type="checkbox" data-consent="terms"> <span id="terms-consent-label">[필수] 이용약관 동의</span> <button type="button" data-policy="terms">전문 보기</button></label>
          <label><input type="checkbox" data-consent="privacy"> <span id="privacy-consent-label">[필수] 개인정보 수집·이용 동의</span> <button type="button" data-policy="privacy">전문 보기</button></label>
          <label><input type="checkbox" data-consent="age"> <span id="age-consent-label">[필수] 만 14세 이상입니다</span></label>
          <label><input type="checkbox" id="consent-all"> <span id="consent-all-label">전체 동의</span></label>
        </fieldset>
        <p id="auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="demo-note" id="demo-note">현재는 이 브라우저에만 계정 정보가 저장됩니다.</p>
      <!-- 게시글 공유 링크도 localStorage 데이터를 사용하므로 현재는 같은 브라우저에서만 열립니다. Firebase 도입 후 서버 저장으로 전환합니다. -->
    </section>
  </main>

  <!-- 로그인한 사용자가 전체 글을 둘러본 뒤 교환일기로 이동합니다. -->
  <div id="app-shell" hidden>
    <header class="app-header">
      <h1><button type="button" id="home-logo" class="app-logo" aria-label="Haru Pin 홈">Haru Pin <span>ハルピン</span></button></h1>
      <nav class="app-language-switch" aria-label="언어 선택">
        <button type="button" lang="ko" aria-pressed="true">한국어</button>
        <button type="button" lang="ja" aria-pressed="false">日本語</button>
      </nav>
      <div class="user-actions">
        <span id="signed-in-name" aria-live="polite"></span>
        <button type="button" id="profile-open-button">프로필</button>
      </div>
    </header>

    <!-- 로그인 직후 모든 게시글의 위치를 둘러보는 환영 지도입니다. -->
    <main class="welcome-map-screen" id="welcome-map-screen" hidden>
      <div id="welcome-map" role="region" aria-label="한국과 일본의 교환일기 지도"></div>
      <section class="welcome-map-greeting" aria-live="polite">
        <h2 id="welcome-map-greeting"></h2>
        <p id="welcome-map-summary"></p>
      </section>
      <button type="button" id="welcome-map-start" class="welcome-map-start"></button>
    </main>

    <main class="map-screen">
      <!-- Leaflet 지도는 피드 옆에서 장소를 확인하는 역할을 합니다. -->
      <div id="map" role="region" aria-label="하루핀 동네 지도"></div>

      <!-- 장소 검색과 지도 지역 이동을 제공합니다. -->
      <div class="map-controls">
        <form id="place-search" role="search">
          <label class="visually-hidden" for="search-input">장소 검색</label>
          <input id="search-input" name="q" type="search" autocomplete="off" placeholder="카페, 맛집, 관광지 검색">
          <button type="submit" aria-label="검색">⌕</button>
        </form>
        <div id="search-results" class="search-results" role="list" aria-label="게시글 검색 결과" hidden></div>
        <p id="search-status" role="status" aria-live="polite"></p>
        <button type="button" id="search-reset" class="search-reset" hidden>전체로 돌아가기</button>
        <div class="city-switch" role="group" aria-label="지역 선택">
          <button type="button" data-region="jeonju" aria-pressed="true">전주</button>
          <button type="button" data-region="tokyo" aria-pressed="false">도쿄</button>
        </div>
      </div>

      <!-- 도시 통합 일기 피드와 필터입니다. -->
      <section class="feed-sheet" id="feed-sheet" aria-labelledby="feed-heading">
        <button class="sheet-handle" id="feed-toggle" type="button" aria-expanded="true" aria-controls="post-list">
          <span class="handle-bar" aria-hidden="true"></span>
          <span id="feed-heading">교환일기</span>
          <span class="sheet-chevron" aria-hidden="true">⌃</span>
        </button>
        <div class="feed-toolbar">
          <div id="feed-region-filters" class="feed-filter-group" role="group" aria-label="도시별 피드">
            <button type="button" data-feed-region="all" aria-pressed="true">전체</button>
            <button type="button" data-feed-region="jeonju" aria-pressed="false">전주</button>
            <button type="button" data-feed-region="tokyo" aria-pressed="false">도쿄</button>
          </div>
          <div class="feed-filter-group feed-sort-options" role="group" aria-label="피드 정렬">
            <button type="button" data-feed-sort="newest" aria-pressed="true">최신순</button>
            <button type="button" data-feed-sort="popular" aria-pressed="false">인기순</button>
          </div>
          <div id="category-filters" class="category-filters" role="group" aria-label="카테고리 검색">
            <button type="button" data-category-filter="all" aria-pressed="true">전체</button>
            <button type="button" data-category-filter="food" aria-pressed="false">숨은 맛집</button>
            <button type="button" data-category-filter="cafe" aria-pressed="false">동네 카페</button>
            <button type="button" data-category-filter="school" aria-pressed="false">학교 생활</button>
            <button type="button" data-category-filter="walk" aria-pressed="false">산책로</button>
          </div>
          <div id="category-legend" class="category-legend" aria-label="카테고리별 핀 색상"></div>
        </div>
        <div id="post-list" aria-live="polite"></div>
        <button type="button" id="feed-load-more" hidden>더 보기</button>
        <button type="button" id="mypage-button">마이페이지</button>
      </section>

      <!-- 빨간색 + 버튼으로 게시글 쓰기를 시작합니다. -->
      <button type="button" id="compose-button" aria-label="새 게시글 작성">+</button>

      <!-- 게시글 작성 폼은 지도 위에 펼쳐집니다. -->
      <section class="compose-sheet" id="compose-panel" aria-labelledby="write-heading" hidden>
        <div class="compose-heading">
          <h2 id="write-heading">동네 이야기 나누기</h2>
          <button type="button" id="close-compose" aria-label="닫기">×</button>
        </div>
        <form id="post-form">
          <label for="nickname">닉네임</label>
          <input id="nickname" name="nickname" type="text" required readonly>
          <label for="post-region">거주 지역</label>
          <select id="post-region" name="region" required>
            <option value="">지역을 선택하세요</option>
            <option value="jeonju">전주</option>
            <option value="tokyo">도쿄</option>
          </select>
          <label for="place">장소 이름</label>
          <input id="place" name="place" type="text" required>
          <label for="category">카테고리</label>
          <select id="category" name="category" required>
            <option value="">카테고리를 선택하세요</option>
            <option value="school">학교생활</option>
            <option value="cafe">동네 카페</option>
            <option value="food">숨은 맛집</option>
            <option value="walk">산책로</option>
          </select>
          <label for="photo">사진</label>
          <input id="photo" name="photo" type="file" accept="image/*">
          <label for="story">짧은 글</label>
          <textarea id="story" name="story" rows="3" required></textarea>
          <label class="posting-warning"><input id="posting-agreement" type="checkbox" required> <span id="posting-warning-text">타인의 얼굴이나 개인정보가 보이는 사진은 올리지 마세요. 올린 글의 책임은 작성자에게 있습니다.</span></label>
          <button type="submit" id="post-submit-button" disabled>게시글 올리기</button>
        </form>
      </section>
    </main>
    <!-- 회원가입 직후 닉네임과 사진을 등록하는 화면입니다. -->
    <main class="profile-setup-screen" id="profile-setup-screen" hidden>
      <section class="profile-panel">
        <h2 id="profile-setup-heading">프로필 설정</h2>
        <div class="avatar-wrap"><img id="setup-avatar" class="profile-avatar" alt="프로필 사진 미리보기"></div>
        <label id="setup-nickname-label" for="setup-nickname">닉네임</label>
        <input id="setup-nickname" maxlength="12" autocomplete="nickname">
        <label id="setup-residence-label" for="setup-residence">거주지</label>
        <select id="setup-residence">
          <option value="jeonju">전주</option>
          <option value="tokyo">도쿄</option>
        </select>
        <p class="profile-hint" id="setup-status" role="status" aria-live="polite"></p>
        <label id="setup-photo-label" for="setup-photo">프로필 사진 (선택)</label>
        <input id="setup-photo" type="file" accept="image/*">
        <button type="button" id="start-button" class="profile-primary">시작하기</button>
      </section>
    </main>
    <!-- 프로필에서 게시글, 댓글, 좋아요를 확인합니다. -->
    <main class="profile-page" id="profile-page" hidden>
      <section class="profile-panel profile-page-panel">
        <button type="button" id="back-to-map" class="profile-back">← 지도로 돌아가기</button>
        <div class="profile-summary">
          <img id="profile-avatar" class="profile-avatar" alt="프로필 사진">
          <div class="profile-summary-details">
            <h2 id="profile-name"></h2>
            <p id="profile-joined"></p>
            <p id="profile-residence"></p>
            <div id="profile-stats" class="profile-stats">
              <span id="profile-post-count"></span>
              <button type="button" data-follow-list="followers"></button>
              <button type="button" data-follow-list="following"></button>
            </div>
            <button type="button" id="profile-follow-button" class="profile-follow-button" hidden></button>
            <button type="button" id="edit-profile-button">프로필 수정</button>
          </div>
        </div>
        <form id="edit-profile-form" class="profile-edit" hidden>
          <label id="edit-nickname-label" for="edit-nickname">닉네임</label>
          <input id="edit-nickname" maxlength="12">
          <label id="edit-residence-label" for="edit-residence">거주지</label>
          <select id="edit-residence">
            <option value="jeonju">전주</option>
            <option value="tokyo">도쿄</option>
          </select>
          <label id="edit-photo-label" for="edit-photo">프로필 사진</label>
          <input id="edit-photo" type="file" accept="image/*">
          <img id="edit-avatar-preview" class="profile-avatar profile-avatar-small" alt="프로필 사진 미리보기">
          <p id="edit-profile-status" class="profile-hint" role="status"></p>
          <button type="submit" id="save-profile-button" class="profile-primary">저장</button>
        </form>
        <div id="profile-tabs" class="profile-tabs" role="tablist" aria-label="프로필 게시물">
          <button type="button" data-profile-tab="posts" role="tab" aria-selected="true">내 포스트</button>
          <button type="button" data-profile-tab="comments" role="tab" aria-selected="false">내 댓글</button>
          <button type="button" data-profile-tab="likes" role="tab" aria-selected="false">좋아요</button>
        </div>
        <div id="profile-content" class="profile-content" role="tabpanel"></div>
        <button type="button" id="policies-button" class="profile-policy-button">약관 및 정책</button>
        <button type="button" id="profile-logout-button" class="profile-logout">로그아웃</button>
        <button type="button" id="delete-account-button" class="delete-account-button">회원 탈퇴</button>
      </section>
    </main>
  </div>
  <div id="post-detail-modal" class="app-modal post-detail-modal" hidden role="dialog" aria-modal="true" aria-labelledby="post-detail-title">
    <section class="modal-card post-detail-card">
      <button type="button" id="post-detail-close" class="modal-close" aria-label="닫기">×</button>
      <button type="button" id="post-detail-back" class="post-detail-back" hidden>← 뒤로</button>
      <img id="post-detail-photo" class="post-detail-photo" alt="">
      <h2 id="post-detail-title"></h2>
      <div class="post-detail-author">
        <button type="button" class="profile-link-image" id="post-detail-profile-link"><img id="post-detail-avatar" alt=""></button>
        <button type="button" class="profile-link-name" id="post-detail-author-name"></button>
        <button type="button" id="post-detail-follow-button" class="inline-follow-button" hidden></button>
      </div>
      <p id="post-detail-place-category" class="post-detail-meta"></p>
      <p id="post-detail-created-at" class="post-detail-date"></p>
      <p id="post-detail-story" class="post-detail-story"></p>
      <div class="post-detail-actions"><button type="button" id="post-detail-like"></button><button type="button" id="post-detail-share"></button></div>
      <h3 id="post-detail-comments-title"></h3>
      <ul id="post-detail-comments" class="post-detail-comments"></ul>
      <form id="post-detail-comment-form" class="post-detail-comment-form"><label class="visually-hidden" for="post-detail-comment-input" id="post-detail-comment-label"></label><input id="post-detail-comment-input" maxlength="500"><button type="button" id="comment-photo-attach" aria-label="사진 첨부">📷</button><input id="comment-photo-file" type="file" accept="image/*" hidden><button type="submit" id="post-detail-comment-submit"></button></form>
      <p id="post-detail-comment-status" class="post-detail-comment-status" role="status" aria-live="polite"></p>
      <div id="comment-photo-preview-wrap" class="comment-photo-preview-wrap" hidden><img id="comment-photo-preview" alt="첨부 사진 미리보기"><button type="button" id="comment-photo-remove" aria-label="사진 삭제">×</button></div>
    </section>
  </div>
  <div id="comment-photo-viewer" class="app-modal comment-photo-viewer" hidden role="dialog" aria-modal="true" aria-label="댓글 사진"><button type="button" class="modal-close" id="comment-photo-viewer-close" aria-label="닫기">×</button><img id="comment-photo-viewer-image" alt="댓글 사진 크게 보기"></div>
  <div id="follow-list-modal" class="app-modal" hidden role="dialog" aria-modal="true" aria-labelledby="follow-list-title">
    <section class="modal-card">
      <button type="button" class="modal-close" data-close-follow-list aria-label="닫기">×</button>
      <h2 id="follow-list-title"></h2>
      <div id="follow-list-content" class="follow-list-content"></div>
    </section>
  </div>
  <div id="policy-modal" class="app-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><section class="modal-card"><button type="button" class="modal-close" data-close-modal aria-label="닫기">×</button><h2 id="modal-title"></h2><div id="policy-content" class="modal-content"></div></section></div>
  <div id="withdraw-modal" class="app-modal" hidden role="dialog" aria-modal="true" aria-labelledby="withdraw-title"><section class="modal-card"><button type="button" class="modal-close" data-close-modal aria-label="닫기">×</button><h2 id="withdraw-title"></h2><p id="withdraw-warning"></p><p id="withdraw-items"></p><p><button type="button" data-policy="privacy" id="withdraw-privacy-link">개인정보 처리방침</button> · <button type="button" data-policy="terms" id="withdraw-terms-link">이용약관</button></p><label><input id="withdraw-confirm" type="checkbox"> <span id="withdraw-confirm-label"></span></label><label for="withdraw-password" id="withdraw-password-label"></label><input id="withdraw-password" type="password" autocomplete="current-password"><p id="withdraw-status" role="status"></p><div class="modal-actions"><button type="button" data-close-modal id="withdraw-cancel"></button><button type="button" id="withdraw-submit" disabled></button></div></section></div>
</body>
</html>
